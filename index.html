<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <main>
        <header>
            <img src="img/logo-culturama.png" alt="Logo culturama">
            <h1>Pesquisa Culturama</h1>
        </header>
    <section>
        <form action="" method="get">
            
            <fieldset>
                 <legend>Dados Pessoais</legend>
                <label for="name">Nome</label>
                <input id="name" name="userName" required>
                <br>

                <label for="age">Idade</label>
                <input id="age" type="number" name="userAge" required min="12" max="100">
                <br>

                <label for="birthDate">Data de nascimento</label>
                <input id="birthDate" type="date" name="userBirthDate">
                <br>

                <label for="email">Email</label>
                <input id="email" type="email" name="userEmail" required>
                <br>

                <label for="phoneNumber">Telefone</label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="XXXXXXXXXXX">
                <br>

                <label for="image">Imagem de perfil</label>
                <input id="image" type="file" name="userImage" accept="image/*">
                <br>
             </fieldset>

             <fieldset>
                <legend>Perfil</legend>

                <p>Gênero</p>

                <input id="fem" type="radio" name="userGender" value="Feminino">
                <label for="fem">Feminino</label>

                <input id="masc" type="radio" name="userGender" value="Masculino">
                <label for="masc">Masculino</label>

                <input id="other" type="radio" name="userGender" value="Outro">
                <label for="other">Outro</label>

                <br>

                <label for="maritalStatus">Estado Civil:</label>
                <select id="maritalStatus" name="userMaritalStatus" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="casado">Casado</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="viuvo">Viúvo</option>
                </select>

                <label for="state">UF</label>
                <select id="state" name="userState" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>

                <label for="city">Cidade</label>
                <input  id="city" type="text" name="userCity" required>
            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes Sociais</p>

                <input id="instagram" type="checkbox" name="socialMedia" value="instagram">
                <label for="instagram">Instagram</label>
                <br>

                <input id="facebook" type="checkbox" name="socialMedia" value="facebook">
                <label for="facebook">Facebook</label>
                <br>

                <input id="linkedin" type="checkbox" name="socialMedia" value="linkedin">
                <label for="linkedin">Linkedin</label>
                <br>
                
                <input id="gitHub" type="checkbox" name="socialMedia" value="gitHub">
                <label for="gitHub">GitHub</label>
                <br>

                <label for="styleMusical">Estilo Musical:</label>
                <input list="styleTypes" id="styleMusical" type="text" name="userStyleMusical">
                <datalist id="styleTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Sertanejo">
                    <option value="Funk">
                    <option value="MPB">
                    <option value="Eletrônica">
                </datalist>
                <br>

                <label for="favoriteColor">Cor Favorita:</label>
                <input id="favoriteColor" type="color" name="userFavoriteColor">
            </fieldset>

            <fieldset>
                <legend>Pesquisa de Satisfação</legend>
                <p>Qual a sua satisfação com a Culturama?</p>
                <input id="otima" type="radio" name="userSatisfaction" value="otima">
                <label for="otima">Ótima</label>
                <br>
                <input id="boa" type="radio" name="userSatisfaction" value="boa">
                <label for="boa">Boa</label>
                <br>
                <input id="regular" type="radio" name="userSatisfaction" value="regular">
                <label for="regular">Regular</label>
                <br>
                <input id="ruim" type="radio" name="userSatisfaction" value="ruim">
                <label for="ruim">Ruim</label>
                <br>
                
                <label for="userComment">Escreva um comentário:</label>
                <textarea name="userComment" id="userComment" placeholder="Digite aqui sua opnião..."></textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmações</legend>
                <input type="checkbox" name="userAgreementTerms" id="userAgreement" value="agree" required>
                <label for="userAgreement">Eu concordo com os termos de uso e política de privacidade.</label><br>

                <input type="checkbox" name="getResult" id="receiveResult" value="accept">
                <label for="receiveResult">Gostaria de receber os resultados da pesquisa no email cadastrado</label>
            </fieldset>
        
             <button type="submit">Enviar</button>
             <button type="reset">Limpar</button>
        </form>
    </section>
    </main>
</body>
</html>
