<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header><h1>Pesquisa Culturama</h1></header>
    <section>
        <form action="" method="get">
            
            <fieldset>
                 <legend>Dados Pessoais</legend>
                <label for="name">Nome</label>
                <input id="name" name="userName" required>
                <br>

                <label for="age">Idade</label>
                <input id="age" type="number" name="userAge" required min="12" max="100">
                <br>

                <label for="birthDate">Data de nascimento</label>
                <input id="birthDate" type="date" name="userBirthDate">
                <br>

                <label for="email">Email</label>
                <input id="email" type="email" name="userEmail" required>
                <br>

                <label for="phoneNumber">Telefone</label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="XXXXXXXXXXX">
                <br>

                <label for="image">Imagem de perfil</label>
                <input id="image" type="file" name="userImage" accept="image/*">
                <br>
             </fieldset>

             <fieldset>
                <legend>Perfil</legend>

                <p>Gênero</p>

                <input id="fem" type="radio" name="userGender" value="Feminino">
                <label for="fem">Feminino</label>

                <input id="masc" type="radio" name="userGender" value="Masculino">
                <label for="masc">Masculino</label>

                <input id="other" type="radio" name="userGender" value="Outro">
                <label for="other">Outro</label>

                <br>

                <label for="maritalStatus">Estado Civil:</label>
                <select id="maritalStatus" name="userMaritalStatus" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="casado">Casado</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="viuvo">Viúvo</option>
                </select>

                <label for="state">UF</label>
                <select id="state" name="userState" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>

                <label for="city">Cidade</label>
                <input  id="city" type="text" name="userCity" required>
            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes Sociais</p>

                <input id="instagram" type="checkbox" name="socialMedia" value="instagram">
                <label for="instagram">Instagram</label>
                <br>

                <input id="facebook" type="checkbox" name="socialMedia" value="facebook">
                <label for="facebook">Facebook</label>
                <br>

                <input id="linkedin" type="checkbox" name="socialMedia" value="linkedin">
                <label for="linkedin">Linkedin</label>
                <br>
                
                <input id="gitHub" type="checkbox" name="socialMedia" value="gitHub">
                <label for="gitHub">GitHub</label>
            </fieldset>
        
             <button type="submit">Enviar</button>
        </form>
    </section>
</body>
</html>
